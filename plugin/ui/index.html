<!doctype html><html lang="de"><head><meta charset="utf-8"><title>PageDeck</title><style>body{font:13px system-ui;color:#eee;background:#282828;padding:10px;margin:0}button,input,textarea{font:inherit;padding:9px;width:100%;box-sizing:border-box;margin:5px 0}button{background:#16765e;color:#fff;border:1px solid #36987e;border-radius:3px;cursor:pointer}button:disabled{background:#555;color:#eee;border-color:#777;cursor:wait}p{line-height:1.45}#code{user-select:all;font:14px monospace;background:#171717;color:#fff;border:1px solid #999;resize:none;overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere}#state{background:#191919;border-left:3px solid #49bd9d;padding:9px}#diagnostic,.version{font-size:11px;color:#ccc}h3{margin:4px 0 8px}</style></head><body>
<h3>PageDeck <span class="version">2.1.0</span></h3>
<pre id="state" role="status" aria-live="polite">Verbindung wird hergestellt …</pre>
<button id="pair" disabled>Neuen Kopplungscode erzeugen</button><textarea id="code" readonly rows="2" spellcheck="false" aria-label="Kopplungscode"></textarea>
<p>Code anklicken, mit Strg+C kopieren und innerhalb von zwei Minuten in den Edge-Einstellungen einfügen.</p>
<button id="status">Verbindung erneut prüfen</button><pre id="diagnostic"></pre>
<p>Die physische Stream-Deck-Taste pausiert die Automatik. Eine erfolgreiche neue Kopplung ersetzt die bisherige.</p><script src="pi.js"></script></body></html>
